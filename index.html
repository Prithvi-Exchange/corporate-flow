}
function focusItems(){if(workTab==='Meetings')return db.meetings.map(m=>`<div class="work-item"><span class="metric-icon">${icon('video')}</span><button class="lead-name-link" data-lead="${m.lead}"><div class="title">${esc(m.title)}</div><div class="sub">${esc(lead(m.lead).name)} · ${m.channel}</div></button><span class="due">${m.time}<br>${shortDate(m.date)}</span></div>`).join('')||'<div class="empty">No meetings scheduled.</div>';const list=db.actions.filter(a=>openAction(a)&&lead(a.lead)?.disposition==='Active'&&(workTab==='Today'?a.due<=today:a.due>today)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);return list.map(a=>`<div class="work-item"><button class="action-circle" data-complete="${a.id}" title="Complete action" aria-label="Complete ${esc(a.title)}"></button><button class="lead-name-link" data-lead="${a.lead}"><div class="title">${esc(a.title)}</div><div class="sub">${esc(lead(a.lead).name)} · ${esc(a.party)}</div></button><span class="due ${a.due<today?'overdue':''}">${a.due<today?'1 day overdue':shortDate(a.due)}</span></div>`).join('')||'<div class="empty">No actions due.</div>'}
function leadTable(items,compact=false){return `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Stage</th>${compact?'':'<th>Disposition</th>'}<th>Next action</th>${compact?'':'<th>Owner</th><th>Stage age</th>'}<th></th></tr></thead><tbody>${items.map(l=>{const a=nextAction(l.id);return `<tr class="clickable" tabindex="0" role="link" aria-label="Open ${esc(l.name)}" data-lead="${l.id}"><td><div class="company">${logo(l)}<div><b>${esc(l.name)}</b><small>${esc(compact?l.industry:l.id+' · '+l.industry)}</small></div></div></td><td>${stageBadge(l.stage)}</td>${compact?'':`<td>${dispositionBadge(l.disposition)}</td>`}<td><div class="next-action">${esc(a?.title||(l.disposition==='Converted'?'Journey complete':'Review paused lead'))}<small class="${a&&a.due<today?'overdue':''}">${a?shortDate(a.due):l.review?'Review '+date(l.review):'—'}</small></div></td>${compact?'':`<td><span class="owner-name">${esc(l.owner)}</span></td><td class="muted">${l.age||0} days</td>`}<td class="row-arrow">${icon('chevron')}</td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">No companies match your filters.</div></td></tr>'}</tbody></table></div>`}
function filteredLeads(){return db.leads.filter(l=>(!query||[l.name,l.contact,l.id,l.industry].some(x=>String(x).toLowerCase().includes(query.toLowerCase())))&&(stageFilter==='All stages'||l.stage===stageFilter)&&(dispositionFilter==='All dispositions'||l.disposition===dispositionFilter))}
function leadsPage(){const items=filteredLeads();return `${pageHead('Corporate leads','Companies, stages and next steps.',`<button data-do="export">${icon('download')} Export</button><button class="primary" data-modal="newLead">${icon('plus')} New lead</button>`)}<div class="filters"><div class="inline"><label class="search-field">${icon('search')}<input id="lead-search" value="${esc(query)}" placeholder="Search companies or contacts…" aria-label="Search leads"></label><select id="stage-filter" aria-label="Filter stage">${['All stages',...stages].map(s=>`<option ${s===stageFilter?'selected':''}>${s}</option>`).join('')}</select><select id="disposition-filter" aria-label="Filter disposition">${['All dispositions','Active','On hold','Closed lost','Converted'].map(s=>`<option ${s===dispositionFilter?'selected':''}>${s}</option>`).join('')}</select></div><div class="segmented"><button data-lead-view="list" class="${leadView==='list'?'active':''}">${icon('list')} List</button><button data-lead-view="board" class="${leadView==='board'?'active':''}">${icon('board')} Board</button></div></div><div id="lead-results">${leadResults(items)}</div>`}
function leadResults(items){if(leadView==='board')return `<div class="board">${stages.map(s=>{const rows=items.filter(l=>l.stage===s);return `<section class="board-col"><div class="board-head">${s}<span>${rows.length}</span></div>${rows.map(l=>`<button class="board-card" data-lead="${l.id}"><div class="company">${logo(l)}<div><b>${esc(l.name)}</b><small>${esc(l.contact)}</small></div></div>${dispositionBadge(l.disposition)} ${badge(l.priority,l.priority==='High'?'amber':'gray')}<p>${esc(nextAction(l.id)?.title||'Journey complete')}</p><div class="inline" style="justify-content:space-between;margin-top:14px"><span class="caption">${l.age} days in stage</span><span class="avatar" style="height:23px;width:23px;font-size:8px">AM</span></div></button>`).join('')}<div class="tiny muted" style="padding:7px 0">${rows.length?'Open a company to move to any stage.':'No companies in this stage'}</div></section>`}).join('')}</div>`;return `<section class="panel">${leadTable(items)}<div class="table-footer"><span>${items.length} companies · Mumbai branch</span><span>All stages and dispositions tracked independently</span></div></section>`}
function actionsPage(){return `${pageHead('My actions','Your tasks and corporate follow-ups.',`<button class="primary" data-modal="newAction">${icon('plus')} Add action</button>`)}<div class="metrics">${metric('Open commitments',db.actions.filter(openAction).length,'task','<span>Accountable RM · Arjun Mehta</span>',true)}${metric('Overdue',db.actions.filter(a=>openAction(a)&&a.due<today).length,'clock','<span class="warn">Follow up today</span>')}${metric('Waiting on corporate',db.actions.filter(a=>a.state==='Waiting on corporate').length,'users','<span>RM continues to track these</span>')}${metric('Blocking actions',db.actions.filter(a=>openAction(a)&&a.blocking).length,'flag','<span>For follow-up</span>')}</div><div class="tabs">${['Open','Overdue','Waiting on corporate','Completed','All'].map(t=>`<button data-task-filter="${t}" class="${taskFilter===t?'active':''}">${t}</button>`).join('')}</div><section class="panel">${actionsTable(null)}</section>`}
function actionsTable(id){let items=db.actions.filter(a=>!id||a.lead===id);if(!id)items=items.filter(a=>taskFilter==='All'||taskFilter==='Open'&&openAction(a)||taskFilter==='Overdue'&&openAction(a)&&a.due<today||taskFilter==='Waiting on corporate'&&a.state===taskFilter||taskFilter==='Completed'&&a.state==='Done');return `<div class="table-wrap"><table><thead><tr><th>Action & source</th>${id?'':'<th>Company</th>'}<th>Responsible party</th><th>Due date</th><th>State</th><th></th></tr></thead><tbody>${items.sort((a,b)=>a.due.localeCompare(b.due)).map(a=>`<tr><td><b style="font-size:12px;font-weight:550">${esc(a.title)}</b><div class="caption" style="margin-top:6px;font-size:10px">${esc(a.origin||'Lead action')} ${a.blocking?' · <span style="color:#b2834d">⚑ Blocking</span>':''}${a.evidence?'<br>Evidence: '+esc(a.evidence):''}</div></td>${id?'':`<td><button class="text-button" data-lead="${a.lead}">${esc(lead(a.lead)?.name)}</button></td>`}<td>${badge(a.party,a.party==='Corporate'?'blue':'gray')}<div class="caption" style="margin-top:5px;font-size:9px">Accountable · ${esc(lead(a.lead)?.owner)}</div></td><td style="color:${a.due<today&&openAction(a)?'#b17668':'#829175'};font-size:11px">${shortDate(a.due)}</td><td>${badge(a.state,a.state==='Done'?'green':a.state==='Waiting on corporate'?'amber':'gray')}</td><td>${openAction(a)?`<button class="small" data-complete="${a.id}">${icon('check')} Complete</button>`:icon('check')}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">No actions in this view.</div></td></tr>`}</tbody></table></div>`}
function detailPage(){const l=current();if(!l)return '';const a=nextAction(l.id);return `<button class="back quiet" data-nav="leads">${icon('back')} All corporate leads</button><div class="detail-top"><div class="detail-title">${logo(l)}<div><h1>${esc(l.name)}</h1><div class="detail-meta">${esc(l.id)}<span>·</span>${esc(l.industry)}<span>·</span>${dispositionBadge(l.disposition)}</div></div></div><div class="head-actions"><button class="small" data-modal="transition">Move stage</button><button class="small" data-modal="disposition">${icon('more')} Manage lead</button><button class="primary small" data-modal="discussion">${icon('plus')} Log interaction</button></div></div><div class="detail-summary"><div><span class="label">Current stage</span><span class="value">${stageBadge(l.stage)}</span></div><div><span class="label">Relationship manager</span><span class="value"><span class="avatar" style="width:23px;height:23px;font-size:8px">AM</span>${esc(l.owner)}</span></div><div><span class="label">Branch</span><span class="value">${esc(l.branch)}</span></div><div><span class="label">Priority</span><span class="value">${badge(l.priority,l.priority==='High'?'amber':'gray')}</span></div><div class="next"><span class="label">Next action</span><span class="value" style="font-size:11px">${a?esc(a.title):l.review?'Review on '+date(l.review):'Journey complete'} ${a?badge(shortDate(a.due),a.due<today?'red':'gray'):''}</span></div></div><div class="stage-strip">${stages.map((s,i)=>`<button class="stage-step quiet ${i<stages.indexOf(l.stage)?'done':s===l.stage?'current':''}" data-move-stage="${s}" title="Move to ${s}"><div class="step-dot">${i<stages.indexOf(l.stage)?'✓':i+1}</div>${s}</button>`).join('')}</div>${l.disposition==='On hold'?`<div class="alert">On hold · ${esc(l.holdReason)} Review due ${date(l.review)}.</div>`:''}<div class="tabs">${['Overview','Discussions','Actions','Onboarding','Journey'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}${t==='Discussions'&&l.rounds?.length?` <span class="tiny">${l.rounds.length}</span>`:''}${t==='Actions'?` <span class="tiny">${db.actions.filter(a=>a.lead===l.id&&openAction(a)).length}</span>`:''}</button>`).join('')}</div>${tab==='Overview'?overviewTab(l):tab==='Discussions'?discussionsTab(l):tab==='Actions'?`<div class="filters"><div><h2>Actions</h2><p class="caption" style="margin-top:5px">Each action has its own due date and state.</p></div><button class="primary small" data-modal="newAction">${icon('plus')} Add action</button></div><section class="panel">${actionsTable(l.id)}</section>`:tab==='Onboarding'?onboardingTab(l):journeyTab(l)}`}
function overviewTab(l){return `<div class="detail-grid"><div><section class="panel"><div class="panel-head"><h2>Company overview</h2><span class="pill">${esc(l.source||'RM referral')}</span></div><div class="info-grid"><div><span class="field-label">Legal / trading name</span><p>${esc(l.name)}</p></div><div><span class="field-label">Industry</span><p>${esc(l.industry)}</p></div><div><span class="field-label">Expected business volume</span><p>${esc(l.volume||'To be confirmed')}</p></div><div><span class="field-label">Website</span><p>${esc(l.website||'—')}</p></div><div style="grid-column:1/-1"><span class="field-label">Business needs</span><p>${esc(l.needs||'Requirements will be captured during discovery.')}</p></div></div></section><section class="panel" style="margin-top:22px"><div class="panel-head"><div><h2>Important notes</h2><p>Internal only</p></div><button class="text-button" data-modal="note">${icon('plus')} Add note</button></div>${l.notes?.length?l.notes.map(n=>`<div class="note">${badge(n.category,n.category==='Blocker'?'amber':'gray')} <span class="tiny muted">${icon('lock')} Internal only</span><div>${esc(n.text)}</div></div>`).join(''):'<div class="empty">No notes yet.</div>'}</section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Latest in the journey</h2><button class="text-button" data-tab="Journey">Full history ${icon('arrow')}</button></div>${timeline(l,3)}</section></div><div><section class="panel"><div class="panel-head"><h2>Corporate contacts</h2><button class="text-button" data-modal="contact">${icon('plus')} Add</button></div><div class="contact"><span class="avatar">${esc(l.contact.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span><div><b>${esc(l.contact)}</b> ${badge('Primary','green')}<p>${esc(l.role||'Corporate contact')}</p><p style="margin-top:8px">${esc(l.email||'Email not recorded')}</p><p>${esc(l.phone||'Phone not recorded')}</p></div></div>${(l.contacts||[]).map(c=>`<div class="contact"><span class="avatar">${esc(c.name.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span><div><b>${esc(c.name)}</b>${c.decision?' '+badge('Decision maker','blue'):''}<p>${esc(c.role)}</p><p>${esc(c.email)}</p></div></div>`).join('')}${l.id==='CL-2026-001'?'<div class="contact"><span class="avatar">RD</span><div><b>Rohan Desai</b> '+badge('Decision maker','blue')+'<p>Finance Manager</p><p style="margin-top:8px">rohan@abctech.example</p></div></div>':''}</section>${l.partner?`<section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Linked partner</h2>${icon('shield')}</div><div class="panel-body"><b style="font-size:13px">${esc(l.partner)}</b><p class="caption" style="margin-top:7px">${l.disposition==='Converted'?'Approved · Verified · Active':'Draft corporate profile · Verification in progress'}</p><button class="text-button" data-tab="Onboarding" style="margin-top:15px">View onboarding case ${icon('arrow')}</button></div></section>`:''}</div></div>`}
function discussionsTab(l){return `<div class="filters"><div><h2>Interaction history</h2><p class="caption" style="margin-top:6px">Calls, meetings and finalized minutes.</p></div><button class="primary small" data-modal="discussion">${icon('plus')} Log interaction</button></div>${[...(l.rounds||[])].reverse().map(r=>`<section class="panel round-card"><div class="round-head"><div><div class="inline">${badge('Round '+r.num,'gray')}${badge(r.outcome,r.outcome==='Terms accepted'?'green':'blue')}</div><h3>${esc(r.subject)}</h3><p class="caption">${date(r.date)} · ${esc(r.direction||'Direction not recorded')} · ${esc(r.channel)} · ${esc(r.participants)}</p></div>${badge(r.state+' · v'+r.revision,r.state==='Finalized'?'green':'amber')}</div><div class="round-body"><span class="field-label">Discussion summary</span>${esc(r.summary)}${r.commercialChangesRequested?`<div class="readonly" style="margin-top:14px">${badge('Commercial changes requested','amber')}<p>${esc(r.changesDetails)}</p><span class="caption">${esc(r.commercial)}</span></div>`:''}${r.actions?.length?`<div style="margin-top:15px;display:flex;gap:7px;flex-wrap:wrap">${r.actions.map(t=>badge(t,'gray')).join('')}</div>`:''}</div><div class="round-actions"><span class="caption">${esc(r.commercial||'No commercial reference')}</span><button class="text-button" data-round="${r.id}">${r.state==='Draft'?'Continue draft':'Read minutes & revisions'} ${icon('arrow')}</button></div></section>`).join('')||'<section class="panel"><div class="empty">'+icon('chat')+'<p>No substantive discussions yet.<br>Log your first discussion to start building the relationship.</p></div></section>'}${(l.interactions||[]).slice().reverse().map(r=>`<section class="panel round-card"><div class="panel-head"><div><h3>${esc(r.subject)}</h3><p class="caption" style="margin-top:7px">${date(r.date)} · ${esc(r.direction)} · ${esc(r.channel)} · ${esc(r.interactionState)} · ${esc(r.outcome)}</p></div>${badge(r.state,'gray')}</div><div class="round-actions"><span class="caption">Contact attempt · no discussion round</span>${r.state==='Draft'?`<button class="text-button" data-interaction-draft="${r.id}">Continue draft</button>`:''}</div></section>`).join('')}` }
function timeline(l,max){const ev=l.events?.length?l.events:[{date:l.created,title:'Corporate lead created',text:`Assigned to ${l.owner}. Initial outreach action scheduled.`}];return `<div class="timeline">${ev.slice(0,max||1000).map(e=>`<div class="timeline-event"><span class="tiny muted">${date(e.date)} · ${esc(l.owner)}</span><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p></div>`).join('')}</div>`}
function journeyTab(l){return `<section class="panel"><div class="panel-head"><div><h2>Journey</h2><p>The history of this relationship.</p></div>${badge('Permanent history','green')}</div>${timeline(l)}</section>`}
function eligibility(l){const issues=[];if(!l.partner)issues.push('Link a corporate partner profile.');(l.requirements||[]).forEach(r=>{if(r.mandatory&&r.status!=='Verified')issues.push(r.name+' must be verified by an authorized reviewer.')});db.actions.filter(a=>a.lead===l.id&&openAction(a)&&a.blocking).forEach(a=>issues.push('Resolve blocking action: '+a.title));if(l.rounds?.some(r=>r.state==='Draft'))issues.push('Finalize pending meeting minutes.');if(l.disposition!=='Active')issues.push('Lead must be active.');return issues}
function onboardingTab(l){if(!l.partner&&l.disposition!=='Converted')return `<section class="panel"><div class="empty">${icon('shield')}<h2 style="margin-bottom:10px">Onboarding</h2><p>Create an optional onboarding case to explore the checklist.<br>Match and link a partner profile, then track the configured requirements.</p><button class="primary" data-do="start-onboarding" style="margin-top:20px">Start onboarding</button></div></section>`;if(l.disposition==='Converted')return `<div class="onboarding-banner"><div><h2>${l.demoStageOverride?'Stage set to Onboarded (demo)':'Partnership activated'}</h2><p>${l.demoStageOverride?'Set manually in this prototype; checklist items and partner confirmation are optional.':esc(l.partner)+' · Approved, verified and active.'} Complete acquisition history is retained.</p></div>${badge('Onboarded · Converted','green')}</div>${journeyTab(l)}`;const req=l.requirements||[],n=req.filter(r=>r.status==='Verified').length;return `<div class="onboarding-banner"><div><h2>Onboarding</h2><p>${n} of ${req.length} requirements verified · Corporate checklist v1 · ${esc(l.partner)}</p><div class="progress"><div style="width:${n/req.length*100}%"></div></div></div><button class="primary small" data-do="eligibility">${icon('shield')} Review onboarding progress</button></div><div class="detail-grid"><section class="panel"><div class="panel-head"><h2>Onboarding requirements</h2>${badge('Mandatory checklist','gray')}</div><div class="table-wrap"><table><thead><tr><th>Requirement / evidence</th><th>Responsible</th><th>Verification state</th></tr></thead><tbody>${req.map((r,i)=>`<tr><td><b style="font-size:11px;font-weight:550">${r.status==='Verified'?'<span class="checkmark">✓</span>':''}${esc(r.name)}</b><div class="caption" style="font-size:10px;margin-top:6px">${esc(r.evidence||r.rejection||'Evidence pending')} · ${r.mandatory?'Mandatory':'Optional'}</div></td><td>${badge(r.party,r.party==='Corporate'?'blue':'gray')}</td><td><button class="small" data-requirement="${i}">${badge(r.status,r.status==='Verified'?'green':r.status==='Rejected'?'red':'amber')} ${icon('edit')}</button></td></tr>`).join('')}</tbody></table></div></section><div><section class="panel"><div class="panel-head"><h2>Partner integration</h2>${icon('shield')}</div><div class="panel-body"><span class="field-label">Authoritative partner reference</span><h3>${esc(l.partner)}</h3><div style="margin:15px 0">${badge('Linked successfully','green')}</div><p class="caption">Partner verification, approval and activation are confirmed through the partner module.</p><div class="alert" style="margin:18px 0 0">Prototype reviewer controls simulate partner checks. Requirements shown here are business configuration.</div></div></section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Readiness at a glance</h2></div><div class="panel-body"><div class="check-list-item">${icon('check')} Commercial acceptance recorded</div><div class="check-list-item">${icon('check')} Corporate partner profile linked</div><div class="check-list-item">${icon(n===req.length?'check':'clock')} ${n}/${req.length} requirements verified</div><div class="check-list-item">${icon('flag')} ${db.actions.filter(a=>a.lead===l.id&&openAction(a)&&a.blocking).length} unresolved blocking actions</div></div></section></div></div>`}
function reportsPage(){const total=db.leads.length,converted=db.leads.filter(l=>l.disposition==='Converted').length;return `${pageHead('Portfolio reports','Pipeline and workload summary.',`<button data-do="export">${icon('download')} Export portfolio</button>`)}<div class="metrics">${metric('Total relationships',total,'building','<span>Mumbai · Arjun Mehta</span>',true)}${metric('Conversion rate',Math.round(converted/total*100)+'%','trend','<span>Converted / all acquisition journeys</span>')}${metric('Average stage age',Math.round(db.leads.filter(l=>l.disposition==='Active').reduce((n,l)=>n+l.age,0)/db.leads.filter(l=>l.disposition==='Active').length)+' days','clock','<span>Active leads in current stage</span>')}${metric('Pending minutes',db.leads.reduce((n,l)=>n+(l.rounds||[]).filter(r=>r.state==='Draft').length,0),'file','<span>Draft minutes awaiting finalization</span>')}</div><div class="report-grid"><section class="panel"><div class="panel-head"><h2>Pipeline distribution</h2>${badge('All leads','gray')}</div><div class="panel-body">${stages.map(s=>{const n=db.leads.filter(l=>l.stage===s).length;return `<div class="report-row"><span>${s}</span><div class="progress"><div style="width:${n/total*100}%"></div></div><b>${n}</b></div>`}).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Attention & follow-through</h2></div><div class="panel-body"><div class="check-list-item">${icon('flag')} ${db.actions.filter(a=>openAction(a)&&a.blocking).length} blocking actions remain unresolved</div><div class="check-list-item">${icon('clock')} ${db.actions.filter(a=>openAction(a)&&a.due<today).length} overdue actions need a follow-up</div><div class="check-list-item">${icon('calendar')} ${db.leads.filter(l=>l.disposition==='On hold').length} held lead review scheduled</div><h3 style="margin:28px 0 15px">Lead disposition</h3>${['Active','On hold','Closed lost','Converted'].map(s=>`<div class="report-row"><span>${s}</span><div class="progress"><div style="width:${db.leads.filter(l=>l.disposition===s).length/total*100}%"></div></div><b>${db.leads.filter(l=>l.disposition===s).length}</b></div>`).join('')}<div class="alert" style="margin-top:25px">Reports reflect the sample portfolio and update as you explore the prototype.</div></div></section></div>`}
function input(name,label,value='',type='text',required=false){return `<label class="field">${label}${required?' *':''}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function area(name,label,value='',required=false){return `<label class="field">${label}${required?' *':''}<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea></label>`}
function select(name,label,options,value){return `<label class="field">${label}<select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
function showModal(type,extra={}){modalState={type,...extra};renderModal();document.querySelector('.modal input,.modal textarea,.modal select,.modal button')?.focus()}

 const form=document.getElementById('modal-form');if(!form)return;
 const isRound=form.elements.substantive.checked&&form.elements.interactionState.value==='Completed'&&form.elements.outcome.value!=='No response';
 document.getElementById('finalize-interaction').textContent=isRound?'Finalize minutes':'Save interaction';
 document.getElementById('discussion-save-hint').textContent=isRound?'Substantive minutes receive a discussion round':'Contact attempt · no discussion round';
 form.elements.changesDetails.required=form.elements.commercialChangesRequested.checked;
 form.elements.commercial.required=form.elements.commercialChangesRequested.checked||form.elements.outcome.value==='Terms accepted';
 if(form.elements.commercial.required)document.getElementById('meeting-extra').open=true;
}

function startOnboarding(){const l=current();if(l.partner){tab='Onboarding';render();return}l.partner='CORP-'+String(900+db.leads.indexOf(l)).padStart(5,'0');l.requirements=structuredClone(seed.leads[0].requirements).map(r=>({...r,status:'Not started',evidence:''}));moveLeadStage(l,'Onboarding');event(l,'Onboarding started',`Draft partner ${l.partner} linked. Corporate checklist v1 saved.`);save();tab='Onboarding';render();toast('Onboarding case created and draft partner linked.')}
function exportPortfolio(){const rows=[['Reference','Company','Industry','Stage','Disposition','RM','Branch','Next action','Due date'],...filteredLeads().map(l=>{const a=nextAction(l.id);return[l.id,l.name,l.industry,l.stage,l.disposition,l.owner,l.branch,a?.title||'',a?.due||'']})];download('salesflow-corporate-portfolio.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');toast('Portfolio exported.')}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function downloadMom(l,r){const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(l.name)} · Round ${r.num} minutes</title><style>body{max-width:800px;margin:50px auto;font:14px Arial;line-height:1.8;color:#243b2e}h1{font-size:28px}h2{font-size:17px;margin-top:28px}header{border-bottom:2px solid #265c44;padding-bottom:20px}footer{margin-top:40px;border-top:1px solid #ddd;font-size:11px;color:#879080}</style></head><body><header><b>SALESFLOW · MEETING MINUTES</b><h1>${esc(l.name)}</h1><p>Round ${r.num} · Revision ${r.revision} · ${date(r.date)} · ${esc(r.channel)}<br>${esc(r.subject)}</p></header><h2>Participants</h2><p>${esc(r.participants)}</p><h2>Agenda & summary</h2><p>${esc(r.summary)}</p><h2>Corporate requirements</h2><p>${esc(r.requirements)}</p><h2>Decisions & commitments</h2><p>${esc(r.decisions)}</p><h2>Commercial reference</h2><p>${esc(r.commercial)}</p><h2>Action items</h2><ul>${(r.actions||[]).map(a=>`<li>${esc(a)}</li>`).join('')}</ul><footer>Finalized revision · Internal notes excluded · Sample prototype record<br>Download does not share this document with corporate contacts.</footer></body></html>`;download(`${l.initials}-Round-${r.num}-MoM-v${r.revision}.html`,html,'text/html');toast('Meeting minutes downloaded. Internal notes excluded.')}
function bind(){document.querySelectorAll('[data-move-stage]').forEach(b=>b.onclick=()=>{if(b.dataset.moveStage===current().stage)return;showModal('transition',{target:b.dataset.moveStage})});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>openLead(b.dataset.lead));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>showModal(b.dataset.modal));document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{workTab=b.dataset.work;render()});document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{chartMode=b.dataset.chart;render()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stageFilter=b.dataset.stage;view='leads';render()});document.querySelectorAll('[data-lead-view]').forEach(b=>b.onclick=()=>{leadView=b.dataset.leadView;render()});document.querySelectorAll('[data-task-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.taskFilter;render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>showModal('complete',{id:+b.dataset.complete}));document.querySelectorAll('[data-interaction-draft]').forEach(b=>b.onclick=()=>showModal('discussion',{id:+b.dataset.interactionDraft}));document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>showModal('round',{id:+b.dataset.round}));document.querySelectorAll('[data-requirement]').forEach(b=>b.onclick=()=>showModal('requirement',{id:+b.dataset.requirement}));document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>{const a=b.dataset.do;if(a==='start-onboarding')startOnboarding();else if(a==='export')exportPortfolio();else if(a==='month')toast('Showing the sample portfolio for October 2026.');else showModal(a)});document.getElementById('global-search')?.addEventListener('keydown',e=>{if(e.key==='Enter'){query=e.target.value;view='leads';render()}});document.getElementById('lead-search')?.addEventListener('input',e=>{query=e.target.value;const results=document.getElementById('lead-results');results.innerHTML=leadResults(filteredLeads());results.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>openLead(b.dataset.lead))});document.getElementById('stage-filter')?.addEventListener('change',e=>{stageFilter=e.target.value;render()});document.getElementById('disposition-filter')?.addEventListener('change',e=>{dispositionFilter=e.target.value;render()});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-lead]'))openLead(e.target.dataset.lead);if(e.key==='Tab'&&modalState){const items=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();

</script></body></html>
